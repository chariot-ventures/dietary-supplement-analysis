# Backend container, deployed by autodeploy.sh from the newest release tag.
# BACKEND_IMAGE is set by autodeploy.sh (dietary-supplement-analysis-backend:vX.Y.Z).
# Reached only over the pocket-supplier Docker network: by the relayer (paid relays)
# and by Caddy for the agents.trackmysupplement.com demo route.
services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    container_name: dietary-supplement-analysis-backend
    restart: unless-stopped
    # Secrets (DSLD_API_KEY, OPENFDA_API_KEY), mode 600, root-owned; optional so a fresh host still starts.
    env_file:
      - path: /opt/pocket/services/dietary-supplement-analysis/settings.env
        required: false
    environment:
      LOG_LEVEL: info
      # Free trial on the public demo route only (see src/lib/freetier.ts); paid relays are never metered.
      FREE_TIER_HOSTS: agents.trackmysupplement.com
    expose: ["8080"]
    mem_limit: 512m
    volumes:
      - dsld-store:/data # persistent NIH label store (see src/lib/store.ts)
    networks: [supplier]
volumes:
  dsld-store:
networks:
  supplier:
    external: true
    name: pocket-supplier
